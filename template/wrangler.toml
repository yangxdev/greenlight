# Cloudflare Pages project config (used by `wrangler pages dev` and `wrangler pages deploy`).
name = "greenlight-product"
pages_build_output_dir = "dist"
# Dates >= 2026-08-04 enable Node.js compatibility by default; the flag is kept explicit anyway.
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Uncomment when the blueprint needs file storage. Create the bucket first:
#   npx wrangler r2 bucket create greenlight-product-files
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "greenlight-product-files"

# Secrets (MONGODB_URI, ...) are NOT stored here. Set them with:
#   npx wrangler pages secret put MONGODB_URI --project-name greenlight-product
