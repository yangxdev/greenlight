# Keeps scout/ typechecked, linted and tested. No AI, no network in tests.
name: Scout CI

on:
  push:
    branches: [main]
    paths: ["scout/**", ".github/workflows/scout-ci.yml"]
  pull_request:
    paths: ["scout/**", ".github/workflows/scout-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scout
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scout/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
