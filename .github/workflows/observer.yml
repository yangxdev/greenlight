# Observer: weekly portfolio report.
#
#   metrics  (no AI)         observer/ scripts: uptime history, Cloudflare Web Analytics, blueprint success metrics,
#                            board state -> metrics.json. Holds the credentials; runs only greenlight's own code.
#   report   (AI, no PAT)    Claude writes reports/<week>.md and returns a verdict per product (JSON)
#   publish  (no AI)         commits reports/, comments the summary on the "Greenlight weekly reports" issue, and
#                            comments on a product's issue only when its verdict changes. Never changes labels.
#
# With no live products the AI step is skipped and publish writes a short board-only report itself.
#
# Mondays: the Scout's Monday run starts this with chain=true, and this starts Ideas when it's done (the Analyst
# reads the report). The schedule below is only a fallback for a Monday when that never happens; a run whose
# report already exists stops at the gate, so the week is never reported twice.
name: Observer

on:
  schedule:
    - cron: "29 13 * * 1" # fallback, Mondays 13:29 UTC
  workflow_dispatch:
    inputs:
      chain:
        description: Part of the Monday chain. Skips if this week's report exists, then starts Ideas. Leave off by hand.
        type: boolean
        default: false

concurrency:
  group: observer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Has this week been reported?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain }}
        run: |
          # The week the report covers: the last complete ISO week, as in observer/src/week.ts.
          week=$(date -u -d "$(date -u +%F) -$(( $(date -u +%u) + 6 )) days" +%G-W%V)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$CHAIN" != true ]; then
            echo "Started by hand: reporting $week"; run=true
          elif gh api "repos/$GITHUB_REPOSITORY/contents/reports/$week.md" --silent 2>/dev/null; then
            echo "reports/$week.md already exists"; run=false
          else
            echo "Reporting $week"; run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  metrics:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    outputs:
      week: ${{ steps.metrics.outputs.week }}
      products: ${{ steps.metrics.outputs.products }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: observer

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: observer/package-lock.json

      - name: Collect metrics
        id: metrics
        working-directory: observer
        env:
          GREENLIGHT_REPO: ${{ github.repository }}
          # The PAT can read private product repos (blueprint success metrics); github.token cannot.
          GITHUB_TOKEN: ${{ secrets.GREENLIGHT_TOKEN || github.token }}
          # The PAT's expiry is checked only when it is the PAT; github.token expires within the hour anyway.
          TOKEN_IS_PAT: ${{ secrets.GREENLIGHT_TOKEN != '' }}
          CLAUDE_TOKEN_EXPIRES: ${{ vars.CLAUDE_TOKEN_EXPIRES }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'greenlight' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --omit=dev
          mkdir -p "$RUNNER_TEMP/observer"
          node src/cli.ts metrics --out "$RUNNER_TEMP/observer/metrics.json"
          {
            echo "week=$(jq -r .week "$RUNNER_TEMP/observer/metrics.json")"
            echo "products=$(jq '.products | length' "$RUNNER_TEMP/observer/metrics.json")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: ${{ runner.temp }}/observer/metrics.json
          retention-days: 30

  report:
    needs: metrics
    if: needs.metrics.outputs.products != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.claude.outputs.structured_output }}
      usage: ${{ steps.usage.outputs.marker }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: metrics
          path: .greenlight-run

      - name: Write weekly report
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # The Monday chain starts this workflow as github-actions[bot], which the action refuses by default.
          allowed_bots: github-actions
          prompt: |
            You are the Greenlight Observer. Your role instructions are in .claude/agents/observer.md.
            Read them first and follow them exactly.

            Inputs: .greenlight-run/metrics.json, compass.md, templates/weekly-report.md, and reports/*.md if any exist.
            Write reports/${{ needs.metrics.outputs.week }}.md, then return the structured result.
            Do not create or modify any other file.
          claude_args: >-
            --max-turns ${{ vars.OBSERVER_MAX_TURNS || '12' }}
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
            --allowedTools "Read,Write,Edit,Glob,Grep"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","products"],"properties":{"summary":{"type":"string"},"products":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["issue","verdict","reason","suggestion"],"properties":{"issue":{"type":"integer"},"verdict":{"type":"string","enum":["keep","improve","archive"]},"reason":{"type":"string"},"suggestion":{"type":"string"}}}}}}'

      # What Claude used in this job, as a marker for the stage comment (greenlight-status adds them up). The action
      # writes its log even when Claude fails or runs out of turns; with no log there is no marker.
      - name: Token usage
        id: usage
        if: always()
        env:
          STAGE: observer
        run: |
          f="$RUNNER_TEMP/claude-execution-output.json"
          [ -s "$f" ] || exit 0
          marker=$(jq -r --arg stage "$STAGE" '
            def n: if type == "number" then . else 0 end;
            def sum(f): map(f | n) | add // 0 | floor;
            [.[]? | objects | select(.type == "result")] | last // empty
            | [(.modelUsage // {}) | objects | .[] | objects] as $m
            | (if ($m | length) > 0
               then {i: ($m | sum(.inputTokens)), o: ($m | sum(.outputTokens)),
                     r: ($m | sum(.cacheReadInputTokens)), w: ($m | sum(.cacheCreationInputTokens))}
               else [.usage // {}] | {i: sum(.input_tokens), o: sum(.output_tokens),
                     r: sum(.cache_read_input_tokens), w: sum(.cache_creation_input_tokens)}
               end) as $u
            | "<!-- greenlight:usage stage=\($stage) in=\($u.i) out=\($u.o) cache_read=\($u.r) cache_write=\($u.w) turns=\(.num_turns | n | floor) cost=\(.total_cost_usd | n | . * 10000 | round / 10000) -->"
          ' "$f" 2>/dev/null || true)
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          echo "${marker:-no usage recorded}"

      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: reports/${{ needs.metrics.outputs.week }}.md
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [metrics, report]
    if: always() && needs.metrics.result == 'success' && needs.report.result != 'failure' && needs.report.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      WEEK: ${{ needs.metrics.outputs.week }}
      RESULT: ${{ needs.report.outputs.result }}
      USAGE: ${{ needs.report.outputs.usage }}
      GH_TOKEN: ${{ github.token }}
      TRACKING_TITLE: Greenlight weekly reports
    steps:
      # This job runs no repository code (only git, gh and jq), so the checkout may keep its token for the push.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: metrics
          path: ${{ runner.temp }}/observer

      - uses: actions/download-artifact@v8
        if: needs.report.result == 'success'
        with:
          name: report
          path: reports

      - name: Write board-only report (no live products)
        if: needs.report.result == 'skipped'
        run: |
          mkdir -p reports
          jq -r '
            "# Weekly report: \(.week)\n",
            "_No live products yet, so this is a board-only report written without AI._\n",
            "## Pipeline\n",
            "- Ideas filed this week: \(.board.ideasFiledThisWeek)",
            "- Open by state: \(.board.counts | to_entries | map("\(.key) \(.value)") | join(" · "))",
            (if (.board.stuck | length) > 0 then "- Stuck: \(.board.stuck | map("#\(.issue) \(.title)") | join(", "))" else "- Stuck: none" end),
            (if (.notes | length) > 0 then "\n## Data notes\n\n" + (.notes | map("- " + .) | join("\n")) else empty end)
          ' "$RUNNER_TEMP/observer/metrics.json" > "reports/$WEEK.md"

      - name: Save verdicts
        if: needs.report.result == 'success'
        run: |
          [ -n "$RESULT" ] || { echo "::error::The Observer returned no structured result"; exit 1; }
          jq --arg week "$WEEK" '{week: $week, summary, products}' <<<"$RESULT" > "reports/$WEEK.json"

      - name: Commit reports
        run: |
          git config user.name "greenlight-observer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "report: $WEEK"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Post to the board
        run: |
          set -euo pipefail
          report_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/reports/${WEEK}.md"

          # One long-lived tracking issue collects the weekly summaries (pin it once by hand).
          tracking=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TRACKING_TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TRACKING_TITLE\") | .number" | head -n1)
          if [ -z "$tracking" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TRACKING_TITLE" \
              --body "The Observer posts a summary here every Monday. Full reports live in \`reports/\`. Pin this issue.")
            tracking=${url##*/}
          fi
          if [ -n "$RESULT" ]; then summary=$(jq -r .summary <<<"$RESULT"); else summary="No live products yet; board-only report."; fi
          # Credentials about to lapse go on top: when one expires, every workflow that uses it fails at once.
          warnings=$(jq -r '.tokens[]? | select(.daysLeft <= 30)
            | if .daysLeft < 0 then "⚠️ **\(.name) expired on \(.expiresOn).** \(.renew)"
              else "⚠️ **\(.name) expires on \(.expiresOn) (\(.daysLeft) days).** \(.renew)" end' \
            "$RUNNER_TEMP/observer/metrics.json")
          body="📊 **Observer, ${WEEK}:** ${summary}"$'\n\n'"Full report: ${report_url}"
          if [ -n "$warnings" ]; then body="${warnings}"$'\n\n'"${body}"; fi
          # The report's usage goes on this one comment only, so it is counted once, not once per product.
          if [ -n "$USAGE" ]; then body+=$'\n\n'"$USAGE"; fi
          gh issue comment "$tracking" --repo "$GITHUB_REPOSITORY" --body "$body"

          [ -n "$RESULT" ] || exit 0
          # Comment on a product's issue only when its verdict changed since the last report. Labels are never touched.
          previous=$(find reports -name '*.json' ! -name "$WEEK.json" | sort | tail -n1)
          jq -c '.products[]' <<<"$RESULT" | while read -r p; do
            issue=$(jq -r .issue <<<"$p")
            verdict=$(jq -r .verdict <<<"$p")
            before=""
            if [ -n "$previous" ]; then
              before=$(jq -r --argjson n "$issue" '.products[] | select(.issue == $n) | .verdict' "$previous")
            fi
            if [ "$verdict" = "$before" ] || { [ -z "$before" ] && [ "$verdict" = "keep" ]; }; then continue; fi
            body="📈 **Observer:** verdict **${verdict}**"
            if [ -n "$before" ]; then body+=" (was ${before})"; fi
            body+=$'\n\n'"$(jq -r .reason <<<"$p")"
            suggestion=$(jq -r .suggestion <<<"$p")
            if [ -n "$suggestion" ]; then body+=$'\n\n'"**Suggestion:** ${suggestion}"; fi
            if [ "$verdict" = "archive" ]; then
              body+=$'\n\n'"To archive: close the issue and set the \`archived\` label. That decision stays yours."
            fi
            body+=$'\n\n'"Report: ${report_url}"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "Commented on #$issue: $before -> $verdict"

            # "improve" with a concrete suggestion becomes a change request under the product's issue. It is only
            # filed: building it still takes your approved label, like any change. One open Observer change per product.
            [ "$verdict" = "improve" ] && [ -n "$suggestion" ] || continue
            open_already=$(gh issue list --repo "$GITHUB_REPOSITORY" --label change --state open --limit 100 \
              --json body --jq "[.[] | select(.body | contains(\"greenlight:parent=${issue} \") and contains(\"greenlight:observer\"))] | length")
            if [ "$open_already" != "0" ]; then echo "#$issue already has an open Observer change"; continue; fi
            title=$(printf '%s' "$suggestion" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-70 | sed -E 's/[[:space:]]+$//')
            reason=$(jq -r .reason <<<"$p")
            change_body=$(printf '### Product issue\n\n#%s\n\n### What should change\n\n%s\n\n### Why\n\nThe Observer'"'"'s verdict for %s is **improve**: %s\n\nReport: %s\n\n### Must not change\n\n_No response_\n\n<!-- greenlight:parent=%s -->\n<!-- greenlight:observer week=%s -->\n' \
              "$issue" "$suggestion" "$WEEK" "$reason" "$report_url" "$issue" "$WEEK")
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "[change] ${title}" --label change --body "$change_body")
            number=${url##*/}
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" --jq .id)
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue/sub_issues" -F "sub_issue_id=$id" >/dev/null \
              || echo "::warning::Could not attach #$number under #$issue as a sub-issue; its body still names #$issue"
            echo "Filed change #$number for #$issue"
          done

  # The next link of the Monday chain. Ideas runs even if this week's report failed or was already there.
  ideas:
    needs: [gate, metrics, report, publish]
    if: always() && inputs.chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start Ideas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ideas.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chain=true
