# Architect: when an issue gets the "approved" label, create the product repo from template/,
# have Claude write blueprint.md into it, then hand back to the human with "blueprint-ready".
#
# Only the blueprint is written by Claude. Repo creation, scaffolding, secrets and labels are
# plain shell steps. Claude gets the short-lived GITHUB_TOKEN and never sees GREENLIGHT_TOKEN.
name: Architect

on:
  issues:
    types: [labeled]

concurrency:
  group: architect-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  blueprint:
    # Human gate: only the repo owner's "approved" label starts the Architect.
    if: github.event.label.name == 'approved' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Check required secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GREENLIGHT_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
        run: |
          missing=0
          for name in CLAUDE_CODE_OAUTH_TOKEN GREENLIGHT_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config --global user.name "greenlight-architect"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Export the idea for the Architect
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p .greenlight-run
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body,url \
            --jq '"# " + .title + "\n\nSource: " + .url + "\n\n" + .body' > .greenlight-run/issue.md
          # Clarifications count only if the owner wrote them.
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate \
            --jq ".[] | select(.user.login == \"$OWNER\") | \"\n## Clarification from the owner\n\n\" + .body" \
            >> .greenlight-run/issue.md
          cat .greenlight-run/issue.md

      - name: Resolve product repo name
        id: repo
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          TITLE: ${{ github.event.issue.title }}
          PREFIX: ${{ vars.PRODUCT_PREFIX }}
        run: |
          # Re-runs reuse the repo recorded by an earlier Architect comment on this issue.
          recorded=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --paginate --jq '.[].body' \
            | grep -oE 'greenlight:repo=[A-Za-z0-9._-]+/[A-Za-z0-9._-]+' | tail -n1 | cut -d= -f2 || true)
          if [ -n "$recorded" ]; then
            full="$recorded"
          else
            slug=$(printf '%s' "$TITLE" | sed -E 's/^\[idea\][[:space:]]*//I' | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
            [ -n "$slug" ] || slug="idea-$ISSUE"
            full="$OWNER/${PREFIX}${slug}"
            # Never adopt an unrelated repo that happens to have the same name.
            if gh repo view "$full" >/dev/null 2>&1; then full="$OWNER/${PREFIX}${slug}-${ISSUE}"; fi
          fi
          exists=false
          if gh repo view "$full" >/dev/null 2>&1; then exists=true; fi
          {
            echo "full=$full"
            echo "name=${full#*/}"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"
          echo "Product repo: $full (exists: $exists)"

      - name: Create product repo from template/
        if: steps.repo.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          FULL: ${{ steps.repo.outputs.full }}
          NAME: ${{ steps.repo.outputs.name }}
          TITLE: ${{ github.event.issue.title }}
          VISIBILITY: ${{ vars.PRODUCT_VISIBILITY || 'private' }}
        run: |
          gh repo create "$FULL" "--$VISIBILITY" --description "Greenlight product (from $GITHUB_REPOSITORY#$ISSUE)"
          scaffold="$RUNNER_TEMP/scaffold"
          cp -a template/. "$scaffold"
          cd "$scaffold"
          grep -rlI --exclude-dir=node_modules 'greenlight-product' . | xargs sed -i "s/greenlight-product/$NAME/g"
          git init -b main
          git add -A
          git commit -m "chore: scaffold from greenlight template" -m "Idea: $GITHUB_REPOSITORY#$ISSUE"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git" main

      - name: Clone product repo
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          FULL: ${{ steps.repo.outputs.full }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git" product
          # Drop the token from the clone's config before Claude runs.
          git -C product remote set-url origin "https://github.com/${FULL}.git"

      - name: Configure product repo secrets and variables
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          FULL: ${{ steps.repo.outputs.full }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GREENLIGHT_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FACTORY_MAX_TURNS: ${{ vars.FACTORY_MAX_TURNS }}
        run: |
          # Personal repos have no shared secrets, so each product repo gets its own copy (values go in via stdin).
          for name in CLAUDE_CODE_OAUTH_TOKEN GREENLIGHT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | gh secret set "$name" --repo "$FULL"; fi
          done
          gh variable set GREENLIGHT_REPO --repo "$FULL" --body "$GITHUB_REPOSITORY"
          gh variable set GREENLIGHT_ISSUE --repo "$FULL" --body "$ISSUE"
          for name in CLAUDE_MODEL FACTORY_MAX_TURNS; do
            if [ -n "${!name}" ]; then gh variable set "$name" --repo "$FULL" --body "${!name}"; fi
          done

      - name: Write blueprint
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are the Greenlight Architect. Your role instructions are in .claude/agents/architect.md.
            Read them first and follow them exactly.

            Inputs (read all of them):
            - compass.md: the owner's interests, stack, no-go list and definition of "good"
            - .greenlight-run/issue.md: the approved idea (issue #${{ github.event.issue.number }})
            - templates/blueprint.md: the required blueprint structure
            - product/CLAUDE.md and product/package.json: the stack and conventions the Factory will follow

            Output: write product/blueprint.md for the product repo ${{ steps.repo.outputs.full }}.
            Do not create, edit or delete any other file.
          claude_args: >-
            --max-turns ${{ vars.ARCHITECT_MAX_TURNS || '20' }}
            ${{ vars.CLAUDE_MODEL && format('--model {0}', vars.CLAUDE_MODEL) || '' }}
            --allowedTools "Read,Write,Edit,Glob,Grep"

      - name: Validate blueprint
        run: |
          bp=product/blueprint.md
          [ -s "$bp" ] || { echo "::error::product/blueprint.md was not written"; exit 1; }
          for heading in '## Scope' '## Data model' '## Routes' '## Tasks' '## Acceptance criteria' '## Non-goals'; do
            grep -qF "$heading" "$bp" || { echo "::error::blueprint.md is missing section '$heading'"; exit 1; }
          done
          tasks=$(grep -cE '^### Task [0-9]+' "$bp" || true)
          if [ "$tasks" -lt 1 ] || [ "$tasks" -gt 10 ]; then
            echo "::error::blueprint.md must have 1-10 tasks ('### Task N: ...'), found $tasks"; exit 1
          fi
          # Claude may only touch product/blueprint.md.
          if ! git diff --quiet; then echo "::error::Architect modified greenlight files:"; git diff --stat; exit 1; fi
          other=$(git -C product status --porcelain | grep -vE '^\?\? blueprint\.md$|^ M blueprint\.md$' || true)
          if [ -n "$other" ]; then echo "::error::Architect touched other product files:"; echo "$other"; exit 1; fi

      - name: Commit blueprint to product repo
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GREENLIGHT_TOKEN }}
          FULL: ${{ steps.repo.outputs.full }}
        run: |
          cd product
          git add blueprint.md
          git diff --cached --quiet || git commit -m "docs: blueprint" -m "Idea: $GITHUB_REPOSITORY#$ISSUE"
          git -c core.hooksPath=/dev/null push "https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git" HEAD:main
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Hand off to the human
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ${{ steps.repo.outputs.full }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          tasks=$(grep -E '^### Task [0-9]+' product/blueprint.md | sed -E 's/^### /- /')
          body=$(cat <<EOF
          📐 **Architect:** blueprint ready at https://github.com/${FULL}/blob/main/blueprint.md (\`${SHA}\`).

          ${tasks}

          Review it (edit blueprint.md directly if needed), then add the \`blueprint-ok\` label to start the Factory.
          To regenerate it instead, comment your feedback on this issue and re-apply \`approved\`.

          <!-- greenlight:repo=${FULL} -->
          EOF
          )
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --remove-label approved --remove-label idea --remove-label stuck --add-label blueprint-ready

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "📐 **Architect:** run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label approved --add-label stuck
