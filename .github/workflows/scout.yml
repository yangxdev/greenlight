# Scout: pulls free internet signals into MongoDB once a day. No AI, no PAT.
# Without the MONGODB_URI secret it still runs and uploads the signals as a JSONL artifact,
# so a manual run is a cheap way to see what the sources return.
#
# The Monday scheduled run also starts the weekly chain: Scout -> Observer -> Ideas. GitHub starts scheduled runs
# hours late at times, so the weekly steps follow each other instead of trusting clock times.
name: Scout

on:
  schedule:
    - cron: "41 5 * * *" # daily 05:41 UTC, off the hour to avoid the :00 queue
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated subset (hn,reddit,github,producthunt,stackexchange,rss). Empty means all enabled.
        required: false
      days:
        description: One-off backfill, look back this many days (1-30). Empty means the normal daily window.
        required: false

concurrency:
  group: scout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      weekly: ${{ steps.weekly.outputs.weekly }}
    defaults:
      run:
        working-directory: scout
    steps:
      - name: Is this the Monday run?
        id: weekly
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" = 1 ]; then weekly=true; else weekly=false; fi
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scout/package-lock.json

      - run: npm ci

      - name: Fetch signals
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ vars.MONGODB_DB || 'greenlight' }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCES: ${{ inputs.sources }}
          DAYS: ${{ inputs.days }}
        run: |
          args=(fetch)
          if [ -n "$SOURCES" ]; then args+=(--sources "$SOURCES"); fi
          if [ -n "$DAYS" ]; then
            if ! [[ "$DAYS" =~ ^[0-9]+$ ]] || [ "$DAYS" -lt 1 ] || [ "$DAYS" -gt 30 ]; then
              echo "::error::days must be a whole number from 1 to 30"
              exit 1
            fi
            args+=(--days "$DAYS")
          fi
          if [ -z "$MONGODB_URI" ]; then
            echo "::notice::MONGODB_URI is not set, so signals go to a JSONL artifact instead of MongoDB"
            args+=(--out "$RUNNER_TEMP/signals.jsonl")
          fi
          node src/cli.ts "${args[@]}"

      - name: Upload signals (only when MongoDB is not configured)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signals
          path: ${{ runner.temp }}/signals.jsonl
          if-no-files-found: ignore
          retention-days: 7

  # Runs even if the fetch failed: the Observer and Ideas still have the rest of the week's signals.
  weekly:
    needs: fetch
    if: always() && needs.fetch.outputs.weekly == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Observer, which then starts Ideas
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run observer.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chain=true
