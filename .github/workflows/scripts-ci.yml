# Keeps the no-AI script packages (scout/, observer/) typechecked, linted and tested, and the workflow helper scripts
# (.github/scripts/) tested. No network in tests.
name: Scripts CI

on:
  push:
    branches: [main]
    paths: ["scout/**", "observer/**", ".github/scripts/**", ".github/workflows/scripts-ci.yml"]
  pull_request:
    paths: ["scout/**", "observer/**", ".github/scripts/**", ".github/workflows/scripts-ci.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [scout, observer]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  workflow-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Template sync tests
        run: python3 -m unittest discover -s .github/scripts -v
